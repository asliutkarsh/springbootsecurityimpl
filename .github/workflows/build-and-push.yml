name: Build and Push Docker Image with Tags

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_BASE: ${{ secrets.DOCKER_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Docker tags
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "VERSION_TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image with tags
        run: |
          docker build -t $IMAGE_BASE:latest \
                       -t $IMAGE_BASE:$SHORT_SHA \
                       -t $IMAGE_BASE:$VERSION_TAG .

      - name: Push Docker images
        run: |
          docker push $IMAGE_BASE:latest
          docker push $IMAGE_BASE:$SHORT_SHA
          docker push $IMAGE_BASE:$VERSION_TAG
